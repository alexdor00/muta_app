# Comprobaciones en cada push y pull request (decisión 9).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Linter y fronteras entre áreas
        run: npm run lint

      - name: CSS solo con tokens
        run: npm run lint:css

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm run test

      - name: Construir
        run: npm run build

      - name: Navegador para los recorridos
        run: npx playwright install --with-deps chromium

      - name: Recorridos en un móvil simulado
        run: npm run e2e
